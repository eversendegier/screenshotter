<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshotter — EdG</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAF7F2;
      --surface: #ffffff;
      --border: #dedad3;
      --text: #161614;
      --muted: #8a8780;
      --accent: #6856FE;
      --radius: 12px;
      --font: system-ui, sans-serif;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      padding: 40px 48px 0;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      gap: 16px;
      -webkit-app-region: drag;
    }
    header * { -webkit-app-region: no-drag; }
    header h1 { font-size: 20px; font-weight: 500; letter-spacing: -0.2px; cursor: pointer; }
    header h1:hover { opacity: 0.6; }
    header span { font-size: 13px; color: var(--muted); margin-left: auto; }

    .input-wrap {
      max-width: 1200px;
      margin: 32px auto 0;
      padding: 0 48px;
      display: flex;
      gap: 10px;
    }

    input {
      padding: 13px 18px; font-size: 15px; font-family: var(--font);
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text); outline: none;
    }
    #urlInput { flex: 1; }
    input:focus { border-color: var(--text); }
    input::placeholder { color: var(--muted); }

    button {
      padding: 13px 24px; font-size: 14px; font-weight: 500; font-family: var(--font);
      background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      cursor: pointer; white-space: nowrap; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.secondary, button.tertiary {
      padding: 9px 16px; font-size: 13px; border: none;
    }
    button.secondary { background: #0E0F0C; color: #fff; }
    button.secondary:hover { opacity: 0.8; }
    button.tertiary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    button.tertiary:hover { background: var(--bg); opacity: 1; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw; max-height: 90vh;
      border-radius: 8px; object-fit: contain;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      cursor: default;
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px;
      color: #fff; font-size: 28px; cursor: pointer; line-height: 1;
      opacity: 0.7;
    }
    .lightbox-close:hover { opacity: 1; }

    /* Timer op loading cards */
    .card-timer {
      position: absolute; bottom: 8px; right: 10px;
      font-size: 11px; color: var(--muted);
    }
    .card-loading-wrap { position: relative; }

    /* Update banner */
    .update-banner {
      position: fixed; bottom: 80px; right: 24px; z-index: 300;
      background: #0E0F0C; color: #fff; font-size: 12px;
      padding: 10px 16px; border-radius: 10px;
      display: none; align-items: center; gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      max-width: 260px;
    }
    .update-banner.visible { display: flex; }
    .update-progress {
      height: 3px; background: rgba(255,255,255,0.2);
      border-radius: 2px; flex: 1; overflow: hidden; min-width: 60px;
    }
    .update-progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.3s; border-radius: 2px; }

    /* Settings */
    .settings-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 200; }
    .settings-btn { padding: 0; font-size: 18px; line-height: 1; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .settings-panel {
      position: absolute; bottom: calc(100% + 8px); right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; width: 260px;
      z-index: 100; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .settings-panel.open { display: block; }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-label { font-size: 13px; color: var(--muted); }
    .setting-select {
      font-size: 12px; font-family: var(--font); color: var(--text);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 8px; cursor: pointer;
    }
    .toggle-group { display: flex; gap: 4px; }
    .toggle-opt {
      padding: 5px 10px; font-size: 12px; font-family: var(--font); font-weight: 400;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; color: var(--text);
      transition: all 0.1s;
    }
    .toggle-opt.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .toggle-opt:hover:not(.active) { border-color: var(--text); }

    .status-line {
      max-width: 1200px; margin: 10px auto 0; padding: 0 48px;
      font-size: 13px; color: var(--muted); min-height: 20px;
    }
    .status-line strong { color: var(--text); font-weight: 500; }

    .progress-wrap { max-width: 1200px; margin: 0 auto; padding: 0 48px; }
    .progress-bar { height: 2px; background: var(--border); overflow: hidden; display: none; }
    .progress-fill { height: 100%; background: var(--text); width: 0%; transition: width 0.4s ease; }

    /* Toolbar */
    .toolbar {
      max-width: 1200px;
      margin: 24px auto 0;
      padding: 0 48px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .toolbar-row { display: flex; align-items: center; gap: 10px; }
    .toolbar-spacer { flex: 1; }
    .toolbar-count { font-size: 13px; color: var(--muted); }
    .toolbar-count strong { color: var(--text); font-weight: 500; }

    /* Paginalijst */
    .page-list {
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 48px;
      display: none;
    }

    .group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 8px;
    }
    .group-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
    }
    .group-header:hover { background: var(--bg); }
    .group-name { font-size: 13px; font-weight: 500; flex: 1; }
    .group-count { font-size: 12px; color: var(--muted); }
    .group-toggle { font-size: 11px; color: var(--muted); transition: transform 0.15s; }
    .group.open .group-toggle { transform: rotate(90deg); }
    .group-btn {
      font-size: 12px; padding: 4px 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; white-space: nowrap;
      color: var(--text); font-family: var(--font); font-weight: 400;
    }
    .group-btn:hover { border-color: var(--text); }

    .group-rows { display: none; border-top: 1px solid var(--border); }
    .group.open .group-rows { display: block; }

    .page-row {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 16px 10px 44px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.1s;
    }
    .page-row:last-child { border-bottom: none; }
    .page-row:hover { background: var(--bg); }
    .page-row.selected { background: #f7f6f2; }
    .row-check {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 1.5px solid var(--border); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: all 0.1s;
    }
    .page-row.selected .row-check { background: var(--text); border-color: var(--text); color: #fff; }
    .row-info { flex: 1; min-width: 0; }
    .row-label { font-size: 13px; font-weight: 400; }
    .row-url { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .group-check {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 1.5px solid var(--border); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: all 0.1s;
    }
    .group-check.all { background: var(--text); border-color: var(--text); color: #fff; }
    .group-check.some { background: var(--border); border-color: var(--border); }

    .site-label {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 16px 16px 6px;
    }
    .site-label:first-child { padding-top: 0; }

    .source-badge {
      font-size: 11px; color: var(--muted);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px;
    }

    /* Grid */
    .grid {
      max-width: 1200px; margin: 20px auto 64px; padding: 0 48px;
      display: none; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      animation: fadeIn 0.3s ease;
    }
    .card:hover { border-color: #bbb8b0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .card-img {
      width: 100%; height: 220px;
      object-fit: cover; object-position: top;
      display: block; background: var(--bg);
    }
    @keyframes shimmer {
      0% { background-position: -800px 0; }
      100% { background-position: 800px 0; }
    }
    .card-loading {
      width: 100%; height: 220px;
      background: linear-gradient(90deg, var(--bg) 25%, #e8e4dd 50%, var(--bg) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
    }
    .card-body {
      padding: 12px 14px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-label { font-size: 13px; font-weight: 500; }
    .card-url { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-warning { font-size: 11px; color: #b7600a; margin-top: 4px; }
    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .card-btn {
      width: 32px; height: 32px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 15px; cursor: pointer; transition: border-color 0.1s;
      text-decoration: none; color: var(--text);
      user-select: none; -webkit-user-select: none;
    }
    .card-btn:hover { border-color: var(--text); background: var(--surface); }
    .card-error {
      width: 100%; height: 220px; background: #fdf2f2;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #c0392b; padding: 16px; text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1 onclick="resetApp()">Screenshotter</h1>
    <span>Evers + de Gier</span>
  </header>

  <div class="input-wrap">
    <input type="text" id="urlInput" placeholder="bedrijf.nl of site1.nl, site2.nl" />
    <button id="discoverBtn" onclick="discover()">Ontdek pagina's →</button>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close" onclick="closeLightbox()">×</span>
    <img id="lightboxImg" src="" alt="" onclick="event.stopPropagation()" />
  </div>

  <div class="update-banner" id="updateBanner">
    <span id="updateText">Update downloaden…</span>
    <div class="update-progress"><div class="update-progress-fill" id="updateProgressFill"></div></div>
  </div>

  <div class="status-line" id="statusLine"></div>

  <div class="settings-wrap">
    <button class="settings-btn" onclick="toggleSettings(event)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div class="settings-panel" id="settingsPanel">
      <div class="setting-row">
        <span class="setting-label">Viewport</span>
        <input type="number" class="setting-select" id="settingViewport" value="1512" min="320" max="3840" style="width:80px;text-align:right" />
      </div>
      <div class="setting-row">
        <span class="setting-label">Scherpte</span>
        <div class="toggle-group" id="settingScale">
          <button class="toggle-opt" data-val="1" onclick="setSetting('scale','1')">1×</button>
          <button class="toggle-opt active" data-val="2" onclick="setSetting('scale','2')">2×</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Formaat</span>
        <div class="toggle-group" id="settingFormat">
          <button class="toggle-opt active" data-val="png" onclick="setSetting('format','png')">PNG</button>
          <button class="toggle-opt" data-val="webp" onclick="setSetting('format','webp')">WebP</button>
          <button class="toggle-opt" data-val="jpeg" onclick="setSetting('format','jpeg')">JPEG</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Stap 1 toolbar: pagina's selecteren -->
  <div class="toolbar" id="toolbar1">
    <div class="toolbar-row">
      <button class="tertiary" onclick="resetApp()">← Terug</button>
      <div class="toolbar-spacer"></div>
      <span class="source-badge" id="sourceBadge" style="display:none"></span>
      <button class="secondary" onclick="selectAll()">Alles selecteren</button>
      <button class="secondary" onclick="deselectAll()">Deselecteren</button>
      <button id="actionBtn"></button>
    </div>
    <div class="toolbar-count" id="toolbarCount"></div>
  </div>

  <!-- Stap 2 toolbar: resultaten -->
  <div class="toolbar" id="toolbar2">
    <div class="toolbar-row">
      <button class="tertiary" onclick="resetApp()">← Terug</button>
      <div class="toolbar-spacer"></div>
      <button class="secondary" id="rerunBtn" style="display:none" onclick="rerunWithSettings()">↺ Opnieuw met nieuwe instellingen</button>
      <button class="tertiary" onclick="downloadAll()">↓ Download alles</button>
    </div>
    <div class="toolbar-count" id="toolbar2Count"></div>
  </div>

  <div class="page-list" id="pageList">
    <div class="page-list-inner" id="pageListInner"></div>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    function setStatus(msg) { document.getElementById('statusLine').innerHTML = msg; }

    let phase = 'idle';
    let discoveredPages = [];
    let selectedUrls = new Set();
    const screenshotFiles = new Map();
    let total = 0, done = 0;
    let currentDomain = '';
    let currentSiteUrl = '';

    function updateToolbar() {
      if (phase === 'select') {
        const count = selectedUrls.size;
        document.getElementById('toolbarCount').innerHTML = `<strong>${count}</strong> van ${discoveredPages.length} geselecteerd`;
        const btn = document.getElementById('actionBtn');
        btn.textContent = `Screenshot maken (${count}) →`;
        btn.disabled = count === 0;
        btn.onclick = () => startScan();
      } else if (phase === 'scan') {
        document.getElementById('toolbar2Count').innerHTML = `<strong>${done}</strong> van ${total} klaar`;
      }
    }

    // --- Instellingen ---
    function toggleSettings(e) {
      e.stopPropagation();
      document.getElementById('settingsPanel').classList.toggle('open');
    }
    document.addEventListener('click', () => document.getElementById('settingsPanel').classList.remove('open'));
    document.getElementById('settingsPanel').addEventListener('click', e => e.stopPropagation());

    function setSetting(key, val) {
      if (key === 'scale') {
        document.querySelectorAll('#settingScale .toggle-opt').forEach(b => b.classList.toggle('active', b.dataset.val === val));
      } else if (key === 'format') {
        document.querySelectorAll('#settingFormat .toggle-opt').forEach(b => b.classList.toggle('active', b.dataset.val === val));
      }
      if (phase === 'scan') document.getElementById('rerunBtn').style.display = '';
    }

    function rerunWithSettings() {
      document.getElementById('rerunBtn').style.display = 'none';
      const pages = discoveredPages.filter(p => selectedUrls.has(p.url));
      screenshotFiles.clear();
      total = 0; done = 0;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      pages.forEach(page => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.pageUrl = page.url;
        card.innerHTML = `<div class="card-loading"></div><div class="card-body"><div class="card-info"><div class="card-label">${page.label}</div><div class="card-url">${page.url}</div></div></div>`;
        grid.appendChild(card);
      });
      total = pages.length;
      updateToolbar();
      startScan(pages);
    }

    function getSettings() {
      return {
        viewport: parseInt(document.getElementById('settingViewport').value, 10),
        scale: parseInt(document.querySelector('#settingScale .active')?.dataset.val || '2', 10),
        format: document.querySelector('#settingFormat .active')?.dataset.val || 'png',
      };
    }

    // --- Reset ---
    function resetApp() {
      phase = 'idle';
      discoveredPages = [];
      selectedUrls.clear();
      screenshotFiles.clear();
      currentDomain = '';
      currentSiteUrl = '';
      document.getElementById('urlInput').value = '';
      document.getElementById('pageList').style.display = 'none';
      document.getElementById('pageListInner').innerHTML = '';
      document.getElementById('grid').style.display = 'none';
      document.getElementById('grid').innerHTML = '';
      document.getElementById('toolbar1').style.display = 'none';
      document.getElementById('toolbar2').style.display = 'none';
      document.getElementById('discoverBtn').disabled = false;
      document.getElementById('discoverBtn').textContent = "Ontdek pagina's →";
      document.getElementById('sourceBadge').style.display = 'none';
      setStatus('');
    }

    function resetDiscoverUI() {
      document.getElementById('pageList').style.display = 'none';
      document.getElementById('pageListInner').innerHTML = '';
      document.getElementById('grid').style.display = 'none';
      document.getElementById('grid').innerHTML = '';
      document.getElementById('toolbar1').style.display = 'none';
      document.getElementById('toolbar2').style.display = 'none';
      document.getElementById('sourceBadge').style.display = 'none';
    }

    async function discoverSingleSite(url) {
      document.getElementById('discoverBtn').disabled = true;
      document.getElementById('discoverBtn').textContent = 'Ophalen...';
      setStatus('Sitemap ophalen…');
      try {
        const res = await fetch('/discover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
        const data = await res.json();
        if (data.error || data.links.length === 0) {
          document.getElementById('urlInput').style.borderColor = '#e05a5a';
          document.getElementById('urlInput').placeholder = data.error ? 'Kon site niet bereiken' : 'Geen pagina\'s gevonden';
          document.getElementById('urlInput').value = '';
          setStatus('');
          setTimeout(() => { document.getElementById('urlInput').style.borderColor = ''; document.getElementById('urlInput').placeholder = 'bedrijf.nl of site1.nl, site2.nl'; }, 3000);
          phase = 'idle';
          return;
        }
        discoveredPages = data.links;
        phase = 'select';
        const source = data.source === 'sitemap' ? 'sitemap.xml' : 'link-crawl';
        const badge = document.getElementById('sourceBadge');
        badge.textContent = source;
        badge.style.display = '';
        setStatus(`<strong>${discoveredPages.length} pagina's gevonden</strong> via ${source}`);
        renderGroups(discoveredPages);
        document.getElementById('pageList').style.display = 'block';
        document.getElementById('toolbar1').style.display = 'flex';
        updateToolbar();
      } catch(e) { phase = 'idle'; setStatus(''); }
      document.getElementById('discoverBtn').disabled = false;
      document.getElementById('discoverBtn').textContent = "Ontdek pagina's →";
    }

    async function discoverMultipleSites(urls) {
      phase = 'discover';
      discoveredPages = []; selectedUrls.clear(); screenshotFiles.clear();
      currentDomain = ''; currentSiteUrl = '';
      resetDiscoverUI();
      document.getElementById('discoverBtn').disabled = true;

      for (const url of urls) {
        const hostname = new URL(url).hostname;
        document.getElementById('discoverBtn').textContent = `Ophalen ${hostname}…`;
        setStatus(`Sitemap ophalen van <strong>${hostname}</strong>…`);
        try {
          const res = await fetch('/discover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
          const data = await res.json();
          if (data.links && data.links.length > 0) {
            data.links.forEach(p => p.siteUrl = url);
            discoveredPages.push(...data.links);
          }
        } catch(e) {}
      }

      document.getElementById('discoverBtn').disabled = false;
      document.getElementById('discoverBtn').textContent = "Ontdek pagina's →";

      if (discoveredPages.length === 0) { phase = 'idle'; setStatus(''); return; }
      phase = 'select';
      setStatus(`<strong>${discoveredPages.length} pagina's gevonden</strong> over ${urls.length} sites`);
      renderGroups(discoveredPages);
      document.getElementById('pageList').style.display = 'block';
      document.getElementById('toolbar1').style.display = 'flex';
      updateToolbar();
    }

    // --- Stap 1: Ontdekken ---
    async function discover() {
      const raw = document.getElementById('urlInput').value.trim();
      if (!raw) return;

      if (raw.includes(',')) {
        const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
        const normalized = parts.map(u => !/^https?:\/\//i.test(u) ? 'https://' + u : u);
        const hosts = normalized.map(u => { try { return new URL(u).hostname; } catch(e) { return ''; } }).filter(Boolean);
        const uniqueHosts = [...new Set(hosts)];

        // Meerdere verschillende domeinen → discovery per site
        if (uniqueHosts.length > 1) {
          document.getElementById('urlInput').value = normalized.join(', ');
          resetDiscoverUI();
          await discoverMultipleSites(normalized);
          return;
        }

        // Zelfde domein, specifieke pagina's → meteen screenshotten
        const pages = normalized.map(u => {
          try {
            const pathname = new URL(u).pathname.replace(/\/$/, '') || '/';
            const label = pathname === '/' ? 'Homepage' : pathname.split('/').filter(Boolean).pop() || pathname;
            return { url: u, label };
          } catch(e) { return null; }
        }).filter(Boolean);
        if (pages.length === 0) return;
        discoveredPages = pages;
        selectedUrls = new Set(pages.map(p => p.url));
        currentSiteUrl = normalized[0];
        resetDiscoverUI();
        startScan(pages);
        return;
      }

      let url = raw;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      document.getElementById('urlInput').value = url;
      phase = 'discover';
      discoveredPages = []; selectedUrls.clear(); screenshotFiles.clear();
      currentDomain = ''; currentSiteUrl = url;
      resetDiscoverUI();
      await discoverSingleSite(url);
    }

    function groupPages(pages) {
      const groups = {};
      for (const page of pages) {
        try {
          const seg = new URL(page.url).pathname.split('/').filter(Boolean)[0] || '__home__';
          if (!groups[seg]) groups[seg] = [];
          groups[seg].push(page);
        } catch(e) {}
      }
      return groups;
    }

    function makePageRow(page, group, allPages) {
      const row = document.createElement('div');
      row.className = 'page-row' + (selectedUrls.has(page.url) ? ' selected' : '');
      row.dataset.url = page.url;
      row.innerHTML = `
        <div class="row-check">${selectedUrls.has(page.url) ? '✓' : ''}</div>
        <div class="row-info">
          <div class="row-label">${page.label}</div>
          <div class="row-url">${page.url}</div>
        </div>
      `;
      row.addEventListener('click', () => { toggleRow(row, page.url); updateGroupCheck(group, allPages); });
      return row;
    }

    function renderGroups(pages) {
      const container = document.getElementById('pageListInner');
      container.innerHTML = '';
      const sites = [...new Set(pages.map(p => p.siteUrl).filter(Boolean))];
      if (sites.length > 1) {
        sites.forEach(siteUrl => {
          const label = document.createElement('div');
          label.className = 'site-label';
          label.textContent = new URL(siteUrl).hostname.replace('www.', '');
          container.appendChild(label);
          renderSiteGroups(pages.filter(p => p.siteUrl === siteUrl), container);
        });
        return;
      }
      renderSiteGroups(pages, container);
    }

    function renderSiteGroups(pages, container) {
      const groups = groupPages(pages);

      for (const [seg, groupPages_] of Object.entries(groups)) {
        const isHome = seg === '__home__';
        const segPath = isHome ? '/' : '/' + seg;

        const overviewPage = groupPages_.find(p => {
          try { const pn = new URL(p.url).pathname.replace(/\/$/, '') || '/'; return pn === segPath; }
          catch(e) { return false; }
        });
        const detailPages = overviewPage ? groupPages_.filter(p => p !== overviewPage) : groupPages_;
        const previewDetail = detailPages[0] || null;
        const moreDetails = detailPages.slice(1);
        const allPages = overviewPage ? [overviewPage, ...detailPages] : detailPages;

        // Auto-select: overzichtspagina of eerste detail
        const autoSelect = overviewPage || previewDetail;
        if (autoSelect) selectedUrls.add(autoSelect.url);

        // Sla allPages op in dataset voor selectAll/deselectAll
        const group = document.createElement('div');
        group.className = 'group';
        group.dataset.allUrls = JSON.stringify(allPages.map(p => p.url));

        // Header
        const headerEl = document.createElement('div');
        headerEl.className = 'group-header';
        const headerLabel = isHome ? 'Home' : segPath;

        if (overviewPage) {
          const isSelected = selectedUrls.has(overviewPage.url);
          headerEl.style.cursor = 'pointer';
          headerEl.innerHTML = `
            <div class="group-check${isSelected ? ' all' : ''}">${isSelected ? '✓' : ''}</div>
            <div class="group-name">${headerLabel}</div>
            <div class="group-count" style="font-size:11px">${overviewPage.url}</div>
          `;
          headerEl.addEventListener('click', (e) => {
            if (e.target === headerEl.querySelector('.group-check')) return;
            const sel = selectedUrls.has(overviewPage.url);
            if (sel) selectedUrls.delete(overviewPage.url); else selectedUrls.add(overviewPage.url);
            updateGroupCheck(group, allPages);
            updateToolbar();
          });
        } else {
          headerEl.innerHTML = `
            <div class="group-check"></div>
            <div class="group-name">${headerLabel}</div>
            <div class="group-count">${detailPages.length} pagina's</div>
          `;
        }

        headerEl.querySelector('.group-check').addEventListener('click', (e) => {
          e.stopPropagation();
          const allSelected = allPages.every(p => selectedUrls.has(p.url));
          allPages.forEach(p => { if (allSelected) selectedUrls.delete(p.url); else selectedUrls.add(p.url); });
          group.querySelectorAll('.page-row').forEach(row => {
            row.classList.toggle('selected', selectedUrls.has(row.dataset.url));
            row.querySelector('.row-check').textContent = selectedUrls.has(row.dataset.url) ? '✓' : '';
          });
          updateGroupCheck(group, allPages);
          updateToolbar();
        });

        // Preview rij (altijd zichtbaar)
        if (previewDetail) {
          group.appendChild(headerEl);
          group.appendChild(makePageRow(previewDetail, group, allPages));
        } else {
          group.appendChild(headerEl);
        }

        // "+ N meer" knop + ingeklapte rijen
        if (moreDetails.length > 0) {
          const rowsEl = document.createElement('div');
          rowsEl.className = 'group-rows';
          moreDetails.forEach(page => rowsEl.appendChild(makePageRow(page, group, allPages)));

          const moreBtn = document.createElement('div');
          moreBtn.className = 'page-row';
          moreBtn.style.cssText = 'padding-left:44px;color:var(--muted);font-size:12px;justify-content:flex-start;gap:6px;';
          moreBtn.innerHTML = `<span class="more-toggle-label">+ ${moreDetails.length} meer tonen</span>`;
          moreBtn.addEventListener('click', () => {
            group.classList.toggle('open');
            moreBtn.querySelector('.more-toggle-label').textContent =
              group.classList.contains('open') ? `− ${moreDetails.length} minder` : `+ ${moreDetails.length} meer tonen`;
          });

          group.appendChild(moreBtn);
          group.appendChild(rowsEl);
        }

        container.appendChild(group);
      }
    }

    function updateGroupCheck(group, pages) {
      const check = group.querySelector('.group-header .group-check');
      if (!check) return;
      const selected = pages.filter(p => selectedUrls.has(p.url)).length;
      check.classList.remove('all', 'some');
      check.textContent = '';
      if (selected === pages.length) { check.classList.add('all'); check.textContent = '✓'; }
      else if (selected > 0) { check.classList.add('some'); check.textContent = '–'; }
    }

    function toggleRow(row, url) {
      if (selectedUrls.has(url)) {
        selectedUrls.delete(url);
        row.classList.remove('selected');
        row.querySelector('.row-check').textContent = '';
      } else {
        selectedUrls.add(url);
        row.classList.add('selected');
        row.querySelector('.row-check').textContent = '✓';
      }
      updateToolbar();
    }

    function selectAll() {
      document.querySelectorAll('.page-row[data-url]').forEach(row => {
        selectedUrls.add(row.dataset.url);
        row.classList.add('selected');
        row.querySelector('.row-check').textContent = '✓';
      });
      document.querySelectorAll('.group').forEach(group => {
        const allUrls = JSON.parse(group.dataset.allUrls || '[]');
        allUrls.forEach(url => selectedUrls.add(url));
        updateGroupCheck(group, allUrls.map(url => ({ url })));
      });
      updateToolbar();
    }

    function deselectAll() {
      selectedUrls.clear();
      document.querySelectorAll('.page-row[data-url]').forEach(row => {
        row.classList.remove('selected');
        row.querySelector('.row-check').textContent = '';
      });
      document.querySelectorAll('.group').forEach(group => {
        const allUrls = JSON.parse(group.dataset.allUrls || '[]');
        updateGroupCheck(group, allUrls.map(url => ({ url })));
      });
      updateToolbar();
    }

    // --- Stap 2: Screenshotten ---
    async function startScan(pagesToScan) {
      const pages = Array.isArray(pagesToScan) ? pagesToScan : discoveredPages.filter(p => selectedUrls.has(p.url));
      if (pages.length === 0) return;

      const url = currentSiteUrl || document.getElementById('urlInput').value.trim();

      if (!pagesToScan) {
        phase = 'scan';
        screenshotFiles.clear();
        total = pages.length; done = 0;
        setStatus(`Screenshots maken van <strong>${total} pagina's</strong>…`);

        document.getElementById('pageList').style.display = 'none';
        document.getElementById('toolbar1').style.display = 'none';
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        grid.style.display = 'grid';

        // Pre-vul grid met placeholder cards + timer
        pages.forEach(page => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.pageUrl = page.url;
          card.innerHTML = `
            <div class="card-loading-wrap">
              <div class="card-loading"></div>
              <span class="card-timer">0s</span>
            </div>
            <div class="card-body">
              <div class="card-info">
                <div class="card-label">${page.label}</div>
                <div class="card-url">${page.url}</div>
              </div>
            </div>
          `;
          const timerEl = card.querySelector('.card-timer');
          const start = Date.now();
          const interval = setInterval(() => {
            if (!timerEl.isConnected) { clearInterval(interval); return; }
            timerEl.textContent = Math.round((Date.now() - start) / 1000) + 's';
          }, 1000);
          card._timerInterval = interval;
          grid.appendChild(card);
        });

        document.getElementById('toolbar2').style.display = 'flex';
        updateToolbar();
      } else {
        total += pages.length;
      }

      // Groepeer per site en scan per site
      const bySite = {};
      for (const page of pages) {
        const key = page.siteUrl || currentSiteUrl || document.getElementById('urlInput').value.trim();
        if (!bySite[key]) bySite[key] = [];
        bySite[key].push(page);
      }
      for (const [siteUrl, sitePages] of Object.entries(bySite)) {
        const res = await fetch('/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: siteUrl, pages: sitePages, settings: getSettings() })
        });
        await readScanStream(res);
      }
    }

    async function readScanStream(res) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done: streamDone, value } = await reader.read();
        if (streamDone) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = JSON.parse(line.slice(6));

          if (data.type === 'screenshot') {
            done++;
            if (data.domain) currentDomain = data.domain;
            addCard(data);
            updateToolbar();
          } else if (data.type === 'error') {
            done++;
            addErrorCard(data);
            updateToolbar();
          } else if (data.type === 'done') {
            document.getElementById('toolbar2Count').innerHTML = `<strong>${done}</strong> screenshot${done !== 1 ? 's' : ''} klaar`;
            setStatus(`<strong>${done} screenshot${done !== 1 ? 's' : ''} klaar</strong> — klik op ↓ om te downloaden`);
            if (data.domain) currentDomain = data.domain;
          }
        }
      }
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    function addCard(data) {
      const imgUrl = data.screenshotUrl;
      const grid = document.getElementById('grid');
      const card = grid.querySelector(`[data-page-url="${CSS.escape(data.url)}"]`) || document.createElement('div');
      if (card._timerInterval) { clearInterval(card._timerInterval); card._timerInterval = null; }

      card.className = 'card';
      card.dataset.file = imgUrl;
      card.dataset.filename = data.filename;
      card.dataset.pageUrl = data.url;

      const warningHtml = data.warning ? `<div class="card-warning">⚠ ${data.warning}</div>` : '';

      card.innerHTML = `
        <img class="card-img" src="${imgUrl}" alt="${data.label}" style="cursor:zoom-in" />
        <div class="card-body">
          <div class="card-info">
            <div class="card-label">${data.label}</div>
            <div class="card-url">${data.url}</div>
            ${warningHtml}
          </div>
          <div class="card-actions">
            <div class="card-btn finder-btn" title="Toon in Finder">⌘</div>
            <div class="card-btn retry-btn" title="Opnieuw maken">↺</div>
            <a class="card-btn" href="${imgUrl}" download="${data.filename}" title="Download">↓</a>
          </div>
        </div>
      `;

      card.querySelector('.card-img').addEventListener('click', () => openLightbox(imgUrl));
      card.querySelector('.finder-btn').addEventListener('click', () => {
        fetch('/open-file', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ domain: data.domain, filename: data.filename }) });
      });
      card.querySelector('.retry-btn').addEventListener('click', () => retryCard(card, data.url, data.label));
      screenshotFiles.set(imgUrl, data.filename);

      if (!card.parentNode) grid.appendChild(card);
    }

    async function retryCard(card, pageUrl, label) {
      card.innerHTML = `
        <div class="card-loading"></div>
        <div class="card-body">
          <div class="card-info">
            <div class="card-label">${label}</div>
            <div class="card-url">${pageUrl}</div>
          </div>
        </div>
      `;
      total++;
      const url = currentSiteUrl || document.getElementById('urlInput').value.trim();
      const res = await fetch('/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, pages: [{ url: pageUrl, label }], settings: getSettings() })
      });
      await readScanStream(res);
    }

    function addErrorCard(data) {
      const grid = document.getElementById('grid');
      const card = grid.querySelector(`[data-page-url="${CSS.escape(data.url || '')}"]`) || document.createElement('div');

      card.className = 'card';
      if (data.url) card.dataset.pageUrl = data.url;
      card.innerHTML = `
        <div class="card-error">✕ ${data.message}</div>
        <div class="card-body">
          <div class="card-info">
            <div class="card-label">${data.label}</div>
            <div class="card-url">${data.url || ''}</div>
          </div>
          <div class="card-actions">
            <div class="card-btn" title="Opnieuw maken">↺</div>
          </div>
        </div>
      `;
      card.querySelector('.card-btn').addEventListener('click', () => retryCard(card, data.url, data.label));
      if (!card.parentNode) grid.appendChild(card);
    }

    async function downloadAll() {
      const btn = document.querySelector('#toolbar2 button:last-child');
      btn.disabled = true;
      btn.textContent = 'Zippen...';

      const zip = new JSZip();
      const folder = zip.folder('screenshots');

      await Promise.all([...screenshotFiles.entries()].map(async ([url, filename]) => {
        const res = await fetch(url);
        folder.file(filename, await res.blob());
      }));

      const content = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      a.download = `screenshots-${currentDomain || 'export'}.zip`;
      a.click();

      btn.disabled = false;
      btn.textContent = '↓ Download alles';
    }


    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') discover();
    });

    if (window.electron) {
      window.electron.onUpdateStatus(({ type, version, percent }) => {
        const banner = document.getElementById('updateBanner');
        const text = document.getElementById('updateText');
        const fill = document.getElementById('updateProgressFill');
        if (type === 'downloading') {
          text.textContent = `Update ${version} downloaden…`;
          fill.style.width = '0%';
          banner.classList.add('visible');
        } else if (type === 'progress') {
          fill.style.width = percent + '%';
          text.textContent = `Update downloaden… ${percent}%`;
        } else if (type === 'ready') {
          text.textContent = 'Update klaar — herstart om te installeren';
          fill.style.width = '100%';
        }
      });
    }
  </script>
